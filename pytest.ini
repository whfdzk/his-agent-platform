[pytest]
# 让 pytest 从项目根目录启动，src.xxx 的 import 才能解析
pythonpath = .

# pytest-asyncio 模式：auto 表示所有 async 测试自动识别，无需手动加 @pytest.mark.asyncio
asyncio_mode = auto

# 所有用例共享一个 session 级事件循环：
# 集成用例会复用模块级缓存的 AsyncOpenAI / Redis 连接，function 级循环关闭后
# 这些连接仍指向已关闭的 loop，会报 "Event loop is closed"。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# 测试文件发现目录（仓库实际目录名为 test；写成 tests 会导致裸跑 pytest 收集 0 用例）
testpaths = test

# 默认只跑不依赖外部服务的确定性单测；
# 依赖真实 LLM / Redis / Milvus / Neo4j / PostgreSQL 的用例标记 integration，
# 用 `pytest -m integration` 单独执行。
addopts = -m "not integration" --strict-markers

markers =
    integration: 依赖真实外部服务（LLM / Redis / Milvus / Neo4j / PostgreSQL）的集成测试
