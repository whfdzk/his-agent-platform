# 由 scripts/eval/gen_pf_config.py 生成，勿手改
description: cases_v2 holdout（43 条）
prompts:
  - "{{question}}"
providers:
  - id: file://./pf_provider.py
    label: local-chat
    config:
      base_url: "http://127.0.0.1:8000"
      timeout: 200000
      timeout_ms: 90
